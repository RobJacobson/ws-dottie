                          AlertFullTitle: Registration Open-WSF Community Meetings Weds January 21
                          AlertFullText: "<p><span data-contrast=\"none\">We’re hosting two online community meetings on Wednesday, Jan. 21. This is your chance to share feedback and ask us questions. Each meeting will start with a short presentation that looks back at 2025. We’ll then cover topics including new vessel construction, terminal upgrades needed for charging vessels, our Service Contingency Plan, workforce development efforts, our budget, and what to expect in the 2026 Washington legislative session.\_</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335557856&quot;:16777215,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:0,&quot;335559740&quot;:259}\">\_</span></p>\r\n<p><span data-contrast=\"none\">Both meetings will cover the same topics, and most of the time will be dedicated to answering questions. Registration is required. To learn more and register, visit our </span><a href=\"https://wsdot.wa.gov/travel/washington-state-ferries/about-us/community-participation\"><span data-contrast=\"none\">Community Participation webpage</span></a><span data-contrast=\"none\">.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335557856&quot;:16777215,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:0,&quot;335559740&quot;:259}\">\_</span></p>"
