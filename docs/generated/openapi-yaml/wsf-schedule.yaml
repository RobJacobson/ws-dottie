                      SeasonalRouteNotes: 'Alternate schedule with <i>Tillikum</i> or <i>Salish</i> in the #3 position.'
                      Alerts:
                        - BulletinID: 110936
                          BulletinFlag: true
                          CommunicationFlag: false
                          PublishDate: '2025-12-19T01:09:42.940Z'
                          AlertDescription: 'Ana/SJs - #3 Tillikum Will Tie Up Early Today Prior to 535p Ana to FH 12/18'
                          DisruptionDescription: null
                          AlertFullTitle: 'Ana/SJs - #3 Tillikum Will Tie Up Early Today Prior to 535p Ana to FH 12/18'
                          AlertFullText: "<table width=\"100%\">\r\n<tbody>\r\n<tr>\r\n<td>\r\n<table width=\"100%\">\r\n<tbody>\r\n<tr>\r\n<td>\r\n<p>The #3 Tillikum <strong>will tie up early tonight</strong><span data-contrast=\"none\">, </span><span data-contrast=\"none\">starting with the 5:35 p.m. westbound sailing</span><span data-contrast=\"none\"> from Anacortes to Friday Harbor. This is due to crewing shortages.\_</span></p>\r\n<p><span data-contrast=\"none\">The following #3 vessel sailings are cancelled: </span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335557856&quot;:16777215,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:0,&quot;335559740&quot;:259}\">\_</span></p>\r\n<ul>\r\n<li aria-setsize=\"-1\" data-leveltext=\"?\" data-font=\"Symbol\" data-listid=\"1\" data-list-defn-props=\"{&quot;335552541&quot;:1,&quot;335559685&quot;:720,&quot;335559991&quot;:360,&quot;469769226&quot;:&quot;Symbol&quot;,&quot;469769242&quot;:[8226],&quot;469777803&quot;:&quot;left&quot;,&quot;469777804&quot;:&quot;?&quot;,&quot;469777815&quot;:&quot;hybridMultilevel&quot;}\" data-aria-posinset=\"1\" data-aria-level=\"1\"><span data-contrast=\"none\">5:35 p.m. Anacortes to Friday Harbor (westbound)\_\_</span></li>\r\n</ul>\r\n<ul>\r\n<li aria-setsize=\"-1\" data-leveltext=\"?\" data-font=\"Symbol\" data-listid=\"1\" data-list-defn-props=\"{&quot;335552541&quot;:1,&quot;335559685&quot;:720,&quot;335559991&quot;:360,&quot;469769226&quot;:&quot;Symbol&quot;,&quot;469769242&quot;:[8226],&quot;469777803&quot;:&quot;left&quot;,&quot;469777804&quot;:&quot;?&quot;,&quot;469777815&quot;:&quot;hybridMultilevel&quot;}\" data-aria-posinset=\"2\" data-aria-level=\"1\"><span data-contrast=\"none\">7:20 p.m. Friday Harbor to Lopez (eastbound)</span></li>\r\n<li aria-setsize=\"-1\" data-leveltext=\"?\" data-font=\"Symbol\" data-listid=\"1\" data-list-defn-props=\"{&quot;335552541&quot;:1,&quot;335559685&quot;:720,&quot;335559991&quot;:360,&quot;469769226&quot;:&quot;Symbol&quot;,&quot;469769242&quot;:[8226],&quot;469777803&quot;:&quot;left&quot;,&quot;469777804&quot;:&quot;?&quot;,&quot;469777815&quot;:&quot;hybridMultilevel&quot;}\" data-aria-posinset=\"2\" data-aria-level=\"1\"><span data-contrast=\"none\">8:10 p.m. Lopez Island to Anacortes (eastbound)\_\_</span></li>\r\n</ul>\r\n<p><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335557856&quot;:16777215,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:0,&quot;335559740&quot;:259}\">\_The last trip out of Lopez to Anacortes is the 7:05 p.m. sailing.</span></p>\r\n<p><span data-contrast=\"none\">New reservations are already blocked due to the </span><a href=\"https://wsdot.com/ferries/schedule/bulletin.aspx#110907\"><span data-contrast=\"none\">current service disruption on the route</span></a><span data-contrast=\"none\">. Existing reservation holders will be prioritized first come, first served and all other customers will travel stand-by. Reservation holders will not be charged a fee if they do not sail.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335557856&quot;:16777215,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:0,&quot;335559740&quot;:259}\">\_</span></p>\r\n<p><span data-teams=\"true\"><br /><br /><br /></span></p>\r\n<table>\r\n<tbody>\r\n<tr>\r\n<td></td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td></td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n<p></p>\r\n</td>\r\n</tr>\r\n</tbody>\r\n</table>"
                          IVRText: null
                        - BulletinID: 110907
                          BulletinFlag: true
                          CommunicationFlag: false
                          PublishDate: '2025-12-16T23:39:31.140Z'
                          AlertDescription: Ana/SJs - Update - Alternate 4-boat schedule through 12/22
                          DisruptionDescription: null
                          AlertFullTitle: Ana/SJs - Update - Alternate schedule through 12/22
                          AlertFullText: "<p>The Tillikum is currently operating as the #3 vessel, due to the Kaleetan being out of service. Beginning Saturday, Dec. 20, the Salish will operate as the #3 vessel, and the Tillikum will move to the #4 vessel interisland position.</p>\r\n<p>This change allows the Tillikum to return to its regular interisland route, and helps us prepare for future vessel moves when the Kaleetan returns to service. We will continue using an <strong>alternate schedule</strong> through Dec. 22 due to the Tillikum and Salish being smaller and slower vessels. View the <a aria-label=\"Link alternate schedule on the Anacortes/San Juan Islands schedule page\" id=\"menuranp\" href=\"https://wsdot.com/Ferries/Schedule/scheduledetailbyroute.aspx?schedrouteid=2400&amp;route=ana-sj\" rel=\"noreferrer noopener\" target=\"_blank\" class=\"fui-Link ___1q1shib f2hkw1w f3rmtva f1ewtqcl fyind8e f1k6fduh f1w7gpdv fk6fouc fjoy568 figsok6 f1s184ao f1mk8lai fnbmjn9 f1o700av f13mvf36 f1cmlufx f9n3di6 f1ids18y f1tx3yz7 f1deo86v f1eh06m1 f1iescvh fhgqx19 f1olyrje f1p93eir f1nev41a f1h8hb77 f1lqvz6u f10aw75t fsle3fq f17ae5zn\" title=\"https://wsdot.com/ferries/schedule/scheduledetailbyroute.aspx?schedrouteid=2400&amp;route=ana-sj\">alternate schedule on the Anacortes/San Juan Islands schedule page</a>.</p>\r\n<p>The Kaleetan remains out of service due to significant cylinder damage that occurred on Friday, Dec. 5 in the vessel’s engine room. We thoroughly investigated the damage, and we are working to make the repairs as quickly and safely as possible.\_</p>\r\n<p><strong>New reservations are blocked through Monday, Dec. 22 due to the smaller capacity and schedule adjustments. </strong>Reservation holders will be prioritized first come, first served and all other customers will travel stand-by. Reservation holders will not be charged a fee if they do not sail. Please expect delays during this service disruption. Thank you for your patience and understanding.</p>"
                          IVRText: null
                        - BulletinID: 110933
                          BulletinFlag: true
                          CommunicationFlag: false
                          PublishDate: '2025-12-18T23:07:31.440Z'
                          AlertDescription: Plan Ahead for Holiday Ferry Travel?
                          DisruptionDescription: null
                          AlertFullTitle: Plan Ahead for Holiday Travel
                          AlertFullText: "<p><span data-contrast=\"none\">Around </span><a href=\"https://wsdot.wa.gov/about/news/2025/projected-700000-sailing-through-winter-waterland-aboard-state-ferries-during-final-13-days-year\"><span data-contrast=\"none\">700,000 passengers are expected from Friday, Dec. 19, through Wednesday, Dec. 31</span></a><span data-contrast=\"none\">. Those boarding in a vehicle should be ready for long waits. The expected surge, combined with the restoration of full domestic service earlier this year, is projected to push 2025 ridership above 20 million. That would mark the system’s first return to that level since 2019.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335557856&quot;:16777215,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:0,&quot;335559740&quot;:259}\">\_</span></p>\r\n<p><b><span data-contrast=\"none\">Holiday schedules</span></b><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\">\_</span></p>\r\n<ul>\r\n<li><a href=\"https://wsdot.com/Ferries/Schedule/scheduledetailbyroute.aspx?route=ed-king\"><span data-contrast=\"none\">Edmonds/Kingston</span></a><span data-contrast=\"none\"> and </span><a href=\"https://wsdot.com/Ferries/Schedule/scheduledetailbyroute.aspx?route=pd-tal\"><span data-contrast=\"none\">Point Defiance/Tahlequah</span></a><span data-contrast=\"none\"> will have a few holiday schedule changes on both Christmas Day, Thursday, Dec. 25 and New Year’s Day, Thursday, Jan. 1.</span><span data-ccp-props=\"{}\">\_</span></li>\r\n<li><a href=\"https://wsdot.com/ferries/schedule/scheduledetailbyroute.aspx?route=ana-sj\"><span data-contrast=\"none\">Anacortes/San Juan Islands</span></a><span data-contrast=\"none\"> will have a few holiday schedule changes on New Year’s Day, Thursday, Jan. 1.</span><span data-ccp-props=\"{}\">\_</span></li>\r\n<li><a href=\"https://wsdot.com/Ferries/Schedule/scheduledetailbyroute.aspx?route=sea-bi\"><span data-contrast=\"none\">Seattle/Bainbridge</span></a><span data-contrast=\"none\"> and </span><a href=\"https://wsdot.com/ferries/schedule/\"><span data-contrast=\"none\">Fauntleroy/Vashon/Southworth</span></a><span data-contrast=\"none\"> will run weekend schedules on both Christmas Day, Thursday, Dec. 25 and New Year’s Day, Thursday, Jan. 1.</span><span data-ccp-props=\"{}\">\_</span></li>\r\n</ul>\r\n<p><span data-contrast=\"none\">All other routes will operate regular schedules. Holiday sailings are marked on the </span><a href=\"https://wsdot.com/ferries/schedule/default.aspx\"><span data-contrast=\"none\">schedules for each route</span></a><span data-contrast=\"none\">.</span><span data-ccp-props=\"{}\">\_</span></p>\r\n<p><b><span data-contrast=\"none\">Busy travel times\_</span></b><span data-ccp-props=\"{}\">\_</span></p>\r\n<p><span data-contrast=\"none\">With Christmas falling on a Thursday, it’s difficult to predict when people will be traveling. However, the busiest sailings will likely be centered around the weekends before and after the holiday. Historically, fewer people catch a ferry during New Year’s week.\_</span><span data-ccp-props=\"{&quot;335559685&quot;:0}\">\_</span></p>\r\n<p><span data-contrast=\"none\">To reduce or eliminate waiting, riders should consider taking an early-morning or late-night sailing or using transit to walk or bike onto the ferry if possible.</span><span data-ccp-props=\"{&quot;335559685&quot;:0}\">\_</span></p>\r\n<p><b><span data-contrast=\"none\">Plan before you go</span></b><span data-ccp-props=\"{}\">\_</span></p>\r\n<p><span data-contrast=\"none\">To help navigate the crowds, customers are encouraged to download and use the WSDOT </span><a href=\"https://wsdot.wa.gov/travel/travel-information-phone\"><span data-contrast=\"none\">mobile app</span></a><span data-contrast=\"none\"> or visit the </span><a href=\"https://wsdot.wa.gov/travel/washington-state-ferries\"><span data-contrast=\"none\">WSF website</span></a><span data-contrast=\"none\"> before heading to the terminal.\_</span><span data-ccp-props=\"{}\">\_</span></p>\r\n<ul>\r\n<li><span data-contrast=\"none\">See </span><a href=\"https://wsdot.com/ferries/schedule/default.aspx\"><span data-contrast=\"none\">sailing schedules by route</span></a><span data-contrast=\"none\">.\_</span><span data-ccp-props=\"{}\">\_</span></li>\r\n<li><span data-contrast=\"none\">View live </span><a href=\"https://wsdot.com/ferries/vesselwatch/terminals.aspx\"><span data-contrast=\"none\">terminal conditions</span></a><span data-contrast=\"none\"> and traffic cameras.\_</span><span data-ccp-props=\"{}\">\_</span></li>\r\n<li><span data-contrast=\"none\">Check for </span><a href=\"https://wsdot.com/ferries/schedule/bulletin.aspx\"><span data-contrast=\"none\">rider alerts</span></a><span data-contrast=\"none\"> that provide service updates by route.\_</span><span data-ccp-props=\"{}\">\_</span></li>\r\n<li><span data-contrast=\"none\">Monitor a </span><a href=\"https://wsdot.com/ferries/vesselwatch/default.aspx\"><span data-contrast=\"none\">real-time map</span></a><span data-contrast=\"none\"> for the location of each operating vessel.\_</span><span data-ccp-props=\"{}\">\_</span></li>\r\n<li><span data-contrast=\"none\">Make </span><a href=\"https://secureapps.wsdot.wa.gov/ferries/reservations/vehicle/default.aspx\"><span data-contrast=\"none\">vehicle reservations</span></a><span data-contrast=\"none\"> for the Anacortes/San Juan Islands or Port Townsend/Coupeville route.</span><span data-ccp-props=\"{}\">\_</span></li>\r\n</ul>"
                          IVRText: null
